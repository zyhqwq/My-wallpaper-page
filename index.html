<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="个人壁纸与美图分享网站 - White and Black Minimal">
    <title>壁纸美图 | 个人分享</title>

    <!-- 站点图标：纯黑方块 (避免控制台 favicon 404 报错) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='black'/></svg>">

    <!-- Font Awesome 6.x 免费版（通过 CDN 加载，提供纯图形图标） -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        /* =====================================================
           全局基础样式 (白黑极简主题)
           ===================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 全局: 纯白背景, 纯黑文字, 系统无衬线字体, 无任何灰色装饰背景 */
        body {
            background: #FFFFFF;
            color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
        }

        /* 页面容器: 最大宽 1200px, 居中, 左右留白 20px */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding-left: 20px;
            padding-right: 20px;
        }

        /* 通用反转效果: 白底黑边 -> 悬停黑底白字 */
        .invert {
            background: #FFFFFF;
            color: #000000;
            border: 1px solid #000000;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .invert:hover {
            background: #000000;
            color: #FFFFFF;
        }

        /* =====================================================
           顶部导航栏
           ===================================================== */
        header {
            border-bottom: 1px solid #000;
        }
        .header-inner {
            padding: 16px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .site-title {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .site-title span {
            border: 1px solid #000;
            border-radius: 4px;
            padding: 2px 10px;
        }

        /* 分类导航: 标签式按钮, 横向可滚动 (移动端) */
        .cate-nav {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .cate-nav::-webkit-scrollbar {
            display: none;
        }
        .filter-btn {
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 4px;
            white-space: nowrap;
        }
        /* 选中状态: 黑底白字 */
        .filter-btn.active {
            background: #000000;
            color: #FFFFFF;
        }

        /* =====================================================
           标签筛选栏 (可多选叠加)
           ===================================================== */
        .tag-bar {
            border-top: 1px solid #000;
            padding: 12px 0;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }
        .tag-label {
            font-size: 12px;
            font-weight: 600;
            margin-right: 4px;
        }
        .tag-btn {
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 4px;
            white-space: nowrap;
        }
        .tag-btn.active {
            background: #000000;
            color: #FFFFFF;
        }

        /* =====================================================
           结果信息
           ===================================================== */
        .result-info {
            padding: 10px 0;
            border-top: 1px solid #000;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* =====================================================
           缩略图网格: 桌面4列 / 平板2列 / 手机1列
           ===================================================== */
        /* 瀑布流布局: 图片等比例展示, 保持自身宽高比, 自适应列数 */
        .grid {
            columns: 4;
            column-gap: 20px;
            padding: 20px 0;
        }

        /* 卡片: 白底黑边, 悬停反转, 避免被列拆分 */
        .card {
            display: block;
            width: 100%;
            text-align: left;
            padding: 0;
            margin-bottom: 20px;
            break-inside: avoid;
            border-radius: 4px;
            background: #FFFFFF;
            border: 1px solid #000;
            color: #000000;
            overflow: hidden;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .card:hover {
            background: #000000;
            color: #FFFFFF;
        }

        /* 缩略图区域: 等比例展示, 宽高随图片自适应, 灰色细边框包裹 */
        .thumb-wrap {
            position: relative;
            width: 100%;
            min-height: 120px;   /* 图片加载前保留高度以便显示加载环 */
            border: 1px solid #d0d0d0;
            background: #FFFFFF;
            overflow: hidden;
        }
        .thumb-wrap img {
            display: block;
            width: 100%;
            height: auto;   /* 保持图片原始宽高比 */
        }

        /* 卡片底部来源信息 (12px 小号字体) */
        .card-source {
            padding: 6px 8px;
            font-size: 12px;
        }

        /* 纯 CSS 旋转黑环加载动画 */
        .spinner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .spinner::before {
            content: "";
            width: 34px;
            height: 34px;
            border: 3px solid #000;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 加载失败占位 */
        .thumb-wrap .load-error {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #888;
        }
        .thumb-wrap.is-error .spinner,
        .thumb-wrap.is-error img {
            display: none;
        }
        .thumb-wrap.is-error .load-error {
            display: flex;
        }

        /* 隐藏状态 (图片加载完成后隐藏 spinner) */
        .thumb-wrap.is-loaded .spinner {
            display: none;
        }

        /* =====================================================
           分页控件
           ===================================================== */
        .pagination {
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-top: 1px solid #000;
        }
        .pagination.hidden {
            display: none;
        }
        .page-btn {
            padding: 8px 16px;
            font-size: 14px;
            border-radius: 4px;
        }
        .page-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .page-info {
            font-size: 14px;
            border: 1px solid #000;
            border-radius: 4px;
            padding: 8px 16px;
        }

        /* =====================================================
           页脚
           ===================================================== */
        footer {
            border-top: 1px solid #000;
            margin-top: 20px;
        }
        .footer-inner {
            padding: 18px 0;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 13px;
        }
        .footer-link {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            text-decoration: none;
            color: #000;
        }

        /* =====================================================
           模态框 (全屏遮罩层, 毛玻璃背景)
           ===================================================== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            /* 毛玻璃: 半透明深色 + 背景模糊 */
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: auto;
        }
        .modal-overlay.open {
            display: flex;
            animation: modalFadeIn 0.35s ease;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 关闭按钮 (X 符号), 固定右上角 */
        .modal-close {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            border-radius: 4px;
            background: #fff;
            color: #000;
            border: 1px solid #000;
            cursor: pointer;
            z-index: 101;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .modal-close:hover {
            background: #000;
            color: #fff;
        }

        /* 模态内容: 标题/日期在上, 分类标签来源在左, 下载按钮在右, 图片居中 */
        .modal-body {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        /* 图片上方: 壁纸标题与添加日期 */
        .modal-head {
            text-align: center;
            animation: modalSideIn 0.5s ease both;
        }

        /* 中段: 左侧信息 / 居中图片 / 右侧下载按钮 */
        .modal-main {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 26px;
        }

        /* 左侧栏: 分类 / 标签 / 来源 (白底黑字方框) */
        .modal-side-info {
            width: 230px;
            flex-shrink: 0;
            text-align: left;
            animation: modalSideIn 0.5s ease 0.08s both;
        }

        /* 信息条目方框: 白底黑字, 与下载按钮同风格 */
        .modal-info-box {
            background: #FFFFFF;
            color: #000000;
            border: 1px solid #000000;
            border-radius: 4px;
            padding: 10px 12px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .modal-info-box:last-child {
            margin-bottom: 0;
        }

        /* 右侧栏: 下载按钮 */
        .modal-side-action {
            width: 210px;
            flex-shrink: 0;
            text-align: center;
            animation: modalSideIn 0.5s ease 0.16s both;
        }
        @keyframes modalSideIn {
            0%   { opacity: 0; transform: translateY(14px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* 原图容器: 供加载转圈图标定位 */
        .modal-img-wrap {
            position: relative;
            max-width: 66vw;
            flex-shrink: 1;
        }

        /* 原图: 居中, 放大动画, 按比例缩放 */
        .modal-img {
            display: block;
            max-width: 100%;
            max-height: 72vh;
            object-fit: contain;
            border: 1px solid #000;
            border-radius: 4px;
            background: #fff;
            animation: modalZoomIn 0.55s cubic-bezier(0.22, 0.9, 0.28, 1.2);
        }
        @keyframes modalZoomIn {
            0%   { transform: scale(0.55); opacity: 0; }
            100% { transform: scale(1);     opacity: 1; }
        }

        /* 图片加载中的转圈图标 (白色圆环) */
        .modal-img-spinner {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .modal-img-spinner.visible {
            display: flex;
        }
        .modal-img-spinner::before {
            content: "";
            width: 44px;
            height: 44px;
            border: 3px solid rgba(255, 255, 255, 0.35);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .modal-row {
            font-size: 14px;
            margin-bottom: 8px;
        }
        .modal-row .modal-label {
            font-weight: 600;
        }

        /* 弹窗内标签: 可点击按钮 (白底黑字, 悬停反转, 选中黑底白字) */
        .modal-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
        }
        .modal-tags .tag {
            font-size: 13px;
            border: 1px solid #000;
            border-radius: 4px;
            padding: 4px 10px;
            background: #fff;
            color: #000;
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .modal-tags .tag:hover {
            background: #000;
            color: #fff;
        }
        .modal-tags .tag.active {
            background: #000;
            color: #fff;
        }

        /* 下载按钮 */
        .action-btn {
            padding: 11px 26px;
            font-size: 14px;
            border-radius: 4px;
            background: #fff;
            color: #000;
            border: 1px solid #000;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s ease, color 0.15s ease;
        }
        .action-btn:hover {
            background: #000;
            color: #fff;
        }
        .action-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            background: #fff;
            color: #000;
        }

        /* =====================================================
           响应式: 平板 2 列, 手机 1 列, 分类导航可横向滚动
           ===================================================== */
        @media (max-width: 900px) {
            .grid {
                columns: 2;
            }
        }
        @media (max-width: 600px) {
            .grid {
                columns: 1;
            }
            .cate-nav,
            .tag-bar {
                flex-wrap: nowrap;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }
            .header-inner {
                flex-direction: column;
                align-items: flex-start;
            }
            .modal-body {
                gap: 12px;
            }
            .modal-main {
                flex-direction: column;
                gap: 14px;
            }
            .modal-side-info,
            .modal-side-action {
                width: 100%;
                text-align: center;
            }
            .modal-side-action {
                order: -1;   /* 手机上: 标题在上, 下载按钮紧随, 图片, 最后信息 */
            }
            .modal-img-wrap {
                max-width: 94vw;
            }
            .modal-img {
                max-height: 55vh;
            }
        }
    </style>
</head>

    <header>
        <div class="container header-inner">
            <div class="site-title"><span>壁纸与美图</span></div>

            <nav class="cate-nav" id="categoryNav" aria-label="分类导航"></nav>
        </div>

    <!-- ================= 标签筛选栏 ================= -->
    <div class="container">
        <div class="tag-bar" id="tagBar">
            <span class="tag-label">标签</span>
            <!-- 标签按钮由 JavaScript 自动填充 -->
        </div>
    </div>

    <!-- ================= 结果信息 ================= -->
    <div class="container">
        <div class="result-info">
            <span id="resultSummary"></span>
            <span id="downloadHint"></span>
        </div>
    </div>

    <!-- ================= 缩略图网格 ================= -->
    <main class="container">
        <div class="grid" id="grid"></div>

    <!-- ================= 分页控件 ================= -->
    <div class="container">
        <nav class="pagination hidden" id="pagination">
            <button class="page-btn invert" id="prevBtn" aria-label="上一页">&lt; 上一页</button>
            <span class="page-info" id="pageInfo">1 / 1</span>
            <button class="page-btn invert" id="nextBtn" aria-label="下一页">下一页 &gt;</button>
        </nav>
    </div>

    <!-- ================= 页脚 ================= -->
    <footer>
        <div class="container footer-inner">
            <span class="site-title" style="font-size:14px;letter-spacing:0;">个人壁纸与美图分享站</span>
            <span class="footer-link invert"><i class="fa-solid fa-heart"></i> 建站名</span>
        </div>
    </footer>

    <!-- ================= 模态框 (全屏遮罩层) ================= -->

        <!-- 关闭按钮 (X 符号使用 Font Awesome) -->
        <button class="modal-close" id="modalClose" aria-label="关闭">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="modal-body">
            <!-- 图片上方: 标题与添加日期 -->
            <div class="modal-head">
                <h2 class="modal-title" id="modalTitle"></h2>
                <p class="modal-row" id="modalDate"></p>
            </div>

            <div class="modal-main">
                <!-- 左侧: 分类 / 标签 / 来源 (白底黑字方框, 标签可点击) -->
                <aside class="modal-side-info">
                    <div class="modal-info-box">
                        <span class="modal-label">分类：</span><span id="modalCategory"></span>
                    </div>
                    <div class="modal-info-box">
                        <span class="modal-label">标签：</span>
                        <span class="modal-tags" id="modalTags"></span>
                    </div>
                    <div class="modal-info-box">
                        <span class="modal-label">来源：</span><span id="modalSource"></span>
                    </div>
                </aside>

                <!-- 中间: 原图 (居中, 放大动画, 加载转圈) -->
                <div class="modal-img-wrap">
                    <img class="modal-img" id="modalImg" alt="原图预览">
                    <div class="modal-img-spinner" id="modalImgSpinner"></div>
                </div>

                <!-- 右侧: 下载按钮 -->
                <aside class="modal-side-action">
                    <button class="action-btn" id="downloadBtn">
                        <i class="fa-solid fa-download"></i> <span id="downloadLabel">下载</span>
                    </button>
                </aside>
            </div>
        </div>
    </div>

    /* ============================================================
       全局配置
       ============================================================ */
    var PER_PAGE = 20;           // 每页显示的缩略图数量

    /* 应用状态: 分类 / 多标签 / 当前页 */
    var state = {
        category: "all",         // "all" 表示全部
        tags: [],                // 已选标签数组 (可多选, 叠加)
        page: 1
    };

    var currentItem = null;      // 模态框中当前显示的图片数据

    /* 可复用的 DOM 引用 */
    var elCategoryNav = document.getElementById("categoryNav");
    var elTagBar = document.getElementById("tagBar");
    var elGrid = document.getElementById("grid");
    var elSummary = document.getElementById("resultSummary");
    var elPagination = document.getElementById("pagination");
    var elPageInfo = document.getElementById("pageInfo");
    var elPrevBtn = document.getElementById("prevBtn");
    var elNextBtn = document.getElementById("nextBtn");

    var modalOverlay = document.getElementById("modalOverlay");
    var modalImg = document.getElementById("modalImg");
    var modalImgSpinner = document.getElementById("modalImgSpinner");
    var modalTitle = document.getElementById("modalTitle");
    var modalCategory = document.getElementById("modalCategory");
    var modalTags = document.getElementById("modalTags");
    var modalSource = document.getElementById("modalSource");
    var modalDate = document.getElementById("modalDate");
    var modalClose = document.getElementById("modalClose");
    var downloadBtn = document.getElementById("downloadBtn");
    var downloadLabel = document.getElementById("downloadLabel");

    /* ============================================================
       工具函数
       ============================================================ */

    /* HTML 转义, 防止注入 */
    function esc(s) {
        var d = document.createElement("div");
        d.textContent = String(s);
        return d.innerHTML;
    }

    /* 从原图 URL 推导下载文件扩展名 */
    function extFrom(url) {
        var m = url.match(/\.([a-zA-Z0-9]+)(?:$|\?)/);
        return m ? m[1] : "jpg";
    }

    /* 刷新当前 URL (History API, 供分享链接) */
    function updateURL() {
        var params = new URLSearchParams();
        if (state.category !== "all") params.set("category", state.category);
        state.tags.forEach(function (t) { params.set("tag", t); }); // 同名参数可多个
        if (state.page > 1) params.set("page", state.page);
        var qs = params.toString();
        var url = location.pathname + (qs ? ("?" + qs) : "");
        history.pushState(null, "", url);
    }

    /* ============================================================
       从数据中自动提取分类与标签
       ============================================================ */
    /* 缓存的元数据 (分类/标签), 首次调用后复用 */
    var metadataCache = null;

    /* extractMeta 的别名, 带备忘录缓存 */
    function getMeta() {
        if (metadataCache) return metadataCache;
        metadataCache = extractMeta();
        return metadataCache;
    }

    function extractMeta() {
        var categories = [];
        var tags = [];
        IMAGES.forEach(function (img) {
            if (categories.indexOf(img.category) === -1) categories.push(img.category);
            img.tags.forEach(function (t) {
                if (tags.indexOf(t) === -1) tags.push(t);
            });
        });
        return { categories: categories, tags: tags };
    }

    /* 渲染分类导航 */
    function renderCategories() {
        var meta = getMeta();
        var html = "";
        // "全部" 始终置于首位
        html += '<button class="filter-btn invert' + (state.category === "all" ? " active" : "") + '" data-category="all">全部</button>';
        meta.categories.forEach(function (c) {
            html += '<button class="filter-btn invert' + (state.category === c ? " active" : "") + '" data-category="' + esc(c) + '">' + esc(c) + "</button>";
        });
        elCategoryNav.innerHTML = html;
    }

    /* 渲染标签筛选栏 */
    function renderTags() {
        var tags = getMeta().tags;
        var html = '<span class="tag-label">标签</span>';
        tags.forEach(function (t) {
            var on = state.tags.indexOf(t) !== -1;
            html += '<button class="tag-btn invert' + (on ? " active" : "") + '" data-tag="' + esc(t) + '">' + esc(t) + "</button>";
        });
        elTagBar.innerHTML = html;
    }

    /* ============================================================
       筛选 + 排序 + 分页
       ============================================================ */

    /* 返回经过分类/标签过滤并按日期降序排序后的完整列表 */
    function getFiltered() {
        return IMAGES
            .filter(function (img) {
                if (state.category !== "all" && img.category !== state.category) return false;
                // 所有选中标签都必须存在于该图片中 (叠加条件)
                return state.tags.every(function (t) { return img.tags.indexOf(t) !== -1; });
            })
            .slice()
            .sort(function (a, b) {
                return new Date(b.dateAdded) - new Date(a.dateAdded); // 最新在前
            });
    }

    /* 渲染缩略图网格 + 分页控件 + 结果信息 */
    function render() {
        var filtered = getFiltered();
        var totalItems = filtered.length;
        var totalPages = Math.max(1, Math.ceil(totalItems / PER_PAGE));

        // 防止 page 越界
        if (state.page > totalPages) state.page = totalPages;
        if (state.page < 1) state.page = 1;

        // 分页切片
        var start = (state.page - 1) * PER_PAGE;
        var pageItems = filtered.slice(start, start + PER_PAGE);

        // ---- 渲染缩略图 ----
        var html = "";
        pageItems.forEach(function (img) {
            html +=
                '<button type="button" class="card" data-id="' + img.id + '">' +
                    '<div class="thumb-wrap">' +
                        '<div class="spinner"></div>' +
                        '<img loading="lazy" src="' + img.thumbnailUrl + '" alt="' + esc(img.title) + '" data-id="' + img.id + '">' +
                        '<div class="load-error">图片加载失败</div>' +
                    '</div>' +
                    '<div class="card-source">来源：' + esc(img.source) + "</div>" +
                "</button>";
        });
        elGrid.innerHTML = html;

        // 若加载失败则隐藏图片并显示占位
        Array.prototype.forEach.call(elGrid.querySelectorAll("img"), function (imgEl) {
            var wrap = imgEl.parentNode;
            imgEl.addEventListener("load", function () { wrap.classList.add("is-loaded"); });
            imgEl.addEventListener("error", function () { wrap.classList.add("is-error"); });
        });

        // ---- 渲染结果摘要 ----
        elSummary.textContent =
            "共 " + totalItems + " 张图片" +
            (state.category !== "all" ? ", 分类：" + state.category : "") +
            (state.tags.length ? ", 标签：" + state.tags.join(" / ") : "") +
            ", 第 " + state.page + " 页";

        // ---- 渲染分页 ----
        elPageInfo.textContent = state.page + " / " + totalPages;
        elPrevBtn.disabled = state.page === 1;
        elNextBtn.disabled = state.page === totalPages;
        // 总页数 <=1 时不显示分页控件
        if (totalPages <= 1) {
            elPagination.classList.add("hidden");
        } else {
            elPagination.classList.remove("hidden");
        }
    }

    /* 统一的重渲入口 (分类/标签/页码变动后调用) */
    function reRender() {
        renderCategories();
        renderTags();
        render();
        updateURL();
    }

    /* ============================================================
       事件绑定
       ============================================================ */

    /* 分类点击: 设置分类并重置到第一页 */
    elCategoryNav.addEventListener("click", function (e) {
        var btn = e.target.closest(".filter-btn");
        if (!btn) return;
        var cat = btn.getAttribute("data-category");
        if (state.category === cat) return;
        state.category = cat;
        state.page = 1;
        reRender();
    });

    /* 标签点击: 叠加/取消多标签, 重置到底一页 */
    elTagBar.addEventListener("click", function (e) {
        var btn = e.target.closest(".tag-btn");
        if (!btn) return;
        var tag = btn.getAttribute("data-tag");
        var idx = state.tags.indexOf(tag);
        if (idx === -1) state.tags.push(tag);
        else state.tags.splice(idx, 1);
        state.page = 1;
        reRender();
    });

    /* 分页: 上一页 / 下一页 */
    elPrevBtn.addEventListener("click", function () {
        if (state.page > 1) { state.page--; render(); updateURL(); }
    });
    elNextBtn.addEventListener("click", function () {
        if (state.page * PER_PAGE < getFiltered().length) { state.page++; render(); updateURL(); }
    });

    /* 缩略图点击: 打开模态框 */
    elGrid.addEventListener("click", function (e) {
        var card = e.target.closest(".card");
        if (!card) return;
        var id = Number(card.getAttribute("data-id"));
        var found = IMAGES.filter(function (i) { return i.id === id; })[0];
        if (found) openModal(found);
    });

    /* 关闭模态框 */
    modalClose.addEventListener("click", closeModal);

    /* ESC 键关闭 (点击背景不关闭, 符合需求) */
    document.addEventListener("keydown", function (e) {
        if (e.key === "Escape" && modalOverlay.classList.contains("open")) closeModal();
    });

    /* 下载按钮 */
    downloadBtn.addEventListener("click", handleDownload);

    /* 弹窗内标签点击: 应用该标签筛选并关闭弹窗 */
    modalTags.addEventListener("click", function (e) {
        var tagBtn = e.target.closest(".tag");
        if (!tagBtn) return;
        var tag = tagBtn.getAttribute("data-tag");
        var idx = state.tags.indexOf(tag);
        if (idx === -1) state.tags.push(tag);
        else state.tags.splice(idx, 1);
        state.page = 1;
        closeModal();
        reRender();
    });

    /* ============================================================
       模态框逻辑
       ============================================================ */

    /* 打开模态框, 填充内容, 加载并显示原图 */
    function openModal(item) {
        currentItem = item;

        modalTitle.textContent = item.title;
        modalCategory.textContent = item.category;
        modalSource.textContent = item.source;
        modalDate.textContent = "添加日期：" + item.dateAdded;

        // 渲染标签为可点击按钮 (点击后应用该标签筛选)
        var tagHtml = "";
        item.tags.forEach(function (t) {
            var active = state.tags.indexOf(t) !== -1 ? " active" : "";
            tagHtml += '<button type="button" class="tag' + active + '" data-tag="' + esc(t) + '">' + esc(t) + "</button>";
        });
        modalTags.innerHTML = tagHtml || "无";

        // 下载按钮始终可用, 下载原图
        downloadLabel.textContent = "下载";
        downloadBtn.disabled = false;

        // 切换图片: 先清空 src, 避免短暂显示上一张图片; 并显示转圈加载图标
        // 放大加载的是原图 (originalUrl), 而非缩略图
        modalImg.removeAttribute("src");
        modalImg.alt = item.title;
        modalImgSpinner.classList.add("visible");
        modalImg.onload = function () { modalImgSpinner.classList.remove("visible"); };
        modalImg.onerror = function () { modalImgSpinner.classList.remove("visible"); };
        modalImg.src = item.originalUrl;

        modalOverlay.classList.add("open");
        document.body.style.overflow = "hidden"; // 锁定背景滚动
    }

    /* 关闭模态框 */
    function closeModal() {
        modalOverlay.classList.remove("open");
        document.body.style.overflow = "";
        currentItem = null;
    }

    /* 下载原图: 直接使用 <a download> 触发保存 (不防盗链) */
    function handleDownload() {
        if (!currentItem) return;

        var filename = currentItem.title + "." + extFrom(currentItem.originalUrl);
        var a = document.createElement("a");
        a.href = currentItem.originalUrl;   // 下载原图而非缩略图
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
    }

    /* ============================================================
       初始化: 解析 URL 参数 -> 渲染
       ============================================================ */
    function initFromURL() {
        var params = new URLSearchParams(location.search);

        var cat = params.get("category");
        if (cat) state.category = cat;

        var tags = params.getAll("tag");
        if (tags.length) state.tags = tags;

        var page = parseInt(params.get("page"), 10);
        if (!isNaN(page) && page > 0) state.page = page;
    }

    /* 浏览器前进/后退: 重新读取 URL 参数并渲染 */
    window.addEventListener("popstate", function () {
        loadStateFromURL();
    });

    function loadStateFromURL() {
        var params = new URLSearchParams(location.search);
        state.category = params.get("category") || "all";
        state.tags = params.getAll("tag");
        var page = parseInt(params.get("page"), 10);
        state.page = (isNaN(page) || page < 1) ? 1 : page;
        render(); // 重新渲染 (重绘导航的选中态)
        renderCategories();
        renderTags();
    }

    /* 启动 */
    initFromURL();
    reRender();
    </script>
</body>
</html>
